name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run application health check
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200"

      - name: Build Docker image
        run: |
          docker build -t devops-cicd-app .
